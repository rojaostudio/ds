name: CI

on:
  pull_request:
    branches: [main]

# Cancela runs anteriores da mesma PR ao receber novo push.
# GitHub Flow: toda branch curta abre PR pra main e roda este CI.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

# Menor privilégio: nenhum job escreve em nada.
permissions: read-all

jobs:
  verify:
    # O nome do job É o contexto do check obrigatório na proteção da main. Renomear aqui
    # (mesmo pra refletir que o lint entrou) faz o check exigido sumir e trava TODO PR em
    # BLOCKED, sem jeito de destravar por dentro — enforce_admins está ligado. Mudar este
    # texto exige atualizar a branch protection na mesma leva.
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Ações fixadas por SHA de commit (tag é mutável); o comentário é a versão no momento
      # da fixação. Mesmos SHAs do release.yml — atualizar os dois juntos.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # turbo --affected precisa do histórico pra diffar com a base
          persist-credentials: false # nenhum passo aqui empurra nada

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      # --ignore-scripts: com o repositorio publico, PR de fork dispara este install. Um PR que
      # altere o lockfile pra puxar uma dependencia com postinstall executaria codigo arbitrario
      # no runner. O impacto e contido (sem secret, permissions: read-all), mas e compute gratis
      # pra quem quiser. O pnpm 10 ja nao roda script de dependencia por padrao — a flag torna
      # isso explicito em vez de depender do default de uma versao.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # DS é consumido por workspace:*; apps precisam dos artefatos gerados
      # (tokens/themes/native) pra typecheck e build.
      # turbo, nao --filter: com a #99 o `ds` depende do `ds-core`, e um filter direto builda
      # so o `ds` — o build dele importa `@rojaostudio/ds-core/tokens`, que aponta pro dist que
      # ainda nao existe. O turbo respeita o `dependsOn: ["^build"]` e resolve a ordem.
      - name: Build design system
        run: pnpm exec turbo run build --filter=@rojaostudio/ds --filter=@rojaostudio/ds-core --filter=rojao-ds --filter=@rojaostudio/ds-codemod

      # O gate do tarball (#105): empacota de verdade e olha o que saiu, em vez de confiar no
      # files[]. Tres defeitos desta familia ja chegaram a versoes publicadas.
      - name: Gate do tarball
        run: pnpm check:pack

      # Informativo, NAO bloqueante — e essa e a decisao, nao um esquecimento. Estado em
      # 03/10/2026: `pnpm audit --prod` acusa 47 avisos (38 high, 9 moderate), e o numero muda
      # toda semana com o feed. O que importa e por onde cada um chega:
      #   - 34 vem de `expo-image` > expo (xmldom, node-forge, postcss, image-size...). No `ds`
      #     o expo-image e peerDependency OPCIONAL: o pacote publicado nao instala o Expo; quem
      #     usa React Native ja tem o proprio Expo, com a versao e os avisos dele.
      #   - 8 vem do `@rojao/config` (eslint e afins), pacote privado que nunca e publicado.
      #   - 5 vem do `@rojaostudio/ds-codemod` > ts-morph > minimatch > brace-expansion 5.0.7
      #     (ReDoS/CPU). ESTE alcanca quem roda o codemod — mas so pela versao travada no NOSSO
      #     lockfile: a faixa publicada (ts-morph ^28 > minimatch ^10 > brace-expansion ^5.0.5)
      #     resolve 5.0.12+, ja corrigido, numa instalacao nova. E o codemod roda via npx, na
      #     maquina do dev, sobre o codigo dele — nao entra no bundle de ninguem.
      # O `check:pack` garante que os pacotes publicados so carregam dependencia de runtime da
      # lista permitida (@rojaostudio/*, @radix-ui/react-*, ts-morph no codemod), o que e uma
      # garantia mais forte e que nao envelhece com o feed. Travar o CI aqui so ensinaria todo
      # mundo a ignorar o passo.
      - name: Auditoria de dependências (informativo)
        run: pnpm audit --prod || true

      # 2.0 (#13): os componentes rodam no Chromium com o axe (vitest em modo navegador). O
      # install acima usa --ignore-scripts, entao o navegador do Playwright vem por este passo.
      - name: Chromium para os testes de componente
        run: pnpm --filter @rojaostudio/ds exec playwright install --with-deps chromium

      - name: Verify (affected)
        run: pnpm exec turbo run lint typecheck test build --affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
