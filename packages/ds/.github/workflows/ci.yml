name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Not yet a hard gate: the repo has no prior typecheck baseline (gen/ carries its
      # own tsconfig). Kept visible; flip to blocking once green (issue #74).
      - name: Typecheck
        run: pnpm typecheck
        continue-on-error: true

      - name: Unit tests
        run: pnpm test

      - name: Theme drift
        run: pnpm validate:themes

      - name: Detect anti-patterns (theme-aware)
        run: pnpm detect
